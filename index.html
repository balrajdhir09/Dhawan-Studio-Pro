<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhawan Studio Pro</title>
  <meta name="theme-color" content="#000000">

  <!-- Cache Control: Force phones to never cache permanently -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    :root {
      --bg: #050505;
      --card: #0d0d0d;
      --card-border: #220808;
      --blood-red: #8b0000;
      --blood-bright: #dc2626;
      --text: #f4f4f5;
      --text-dim: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 2, 2, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--blood-red);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .brand-wrap { display: flex; flex-direction: column; gap: 2px; }
    .brand { font-weight: 900; font-size: 16px; letter-spacing: 0.8px; color: #fff; }
    .brand span { color: var(--blood-bright); }
    .sub-brand-tag { font-size: 10px; font-weight: 700; color: #ff4d4d; letter-spacing: 1.5px; text-transform: uppercase; }

    .update-pill {
      background: #1a0505;
      border: 1px solid var(--blood-bright);
      color: #ff8888;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .title-row {
      font-size: 12px;
      font-weight: 800;
      color: var(--blood-bright);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    label { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
    
    input[type="text"], textarea {
      width: 100%;
      background: #000000;
      border: 1px solid #2a0808;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--blood-bright); }
    
    textarea { 
      min-height: 170px; 
      font-family: ui-monospace, monospace; 
      font-size: 12.5px; 
      resize: vertical; 
    }

    .icon-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #080202;
      padding: 10px;
      border: 1px dashed var(--card-border);
      border-radius: 6px;
    }
    .icon-preview {
      width: 48px;
      height: 48px;
      background: #000000;
      border: 1px solid var(--blood-red);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .icon-preview img { width: 100%; height: 100%; object-fit: cover; }

    .primary-install-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }
    @media(max-width: 480px) { .primary-install-box { grid-template-columns: 1fr; } }

    .install-big-btn {
      background: linear-gradient(135deg, #8b0000, #dc2626);
      color: #fff;
      border: 1px solid #ff4d4d;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .apk-cloud-btn {
      background: #140505;
      color: #ff6666;
      border: 1px solid var(--blood-red);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-row { display: flex; gap: 8px; }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #2e0d0d;
      background: #080202;
      color: #ccc;
    }

    .preview-panel {
      background: #080202;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .phone {
      width: 100%;
      max-width: 320px;
      height: 600px;
      background: #000000 !important;
      border: 5px solid #1a0606;
      border-radius: 32px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .notch-bar { height: 20px; background: #000000; display: flex; justify-content: center; align-items: center; }
    .camera { width: 8px; height: 8px; background: #0e0e0e; border-radius: 50%; }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000 !important;
    }

    .nav-bar-pill { height: 16px; background: #000000; display: flex; justify-content: center; align-items: center; }
    .gesture-indicator { width: 90px; height: 3px; background: #262626; border-radius: 4px; }

    footer.app-footer {
      text-align: center;
      padding: 14px 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ff4d4d;
      text-transform: uppercase;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #140404;
      border: 1px solid var(--blood-bright);
      color: #fff;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      z-index: 9999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand">&#x25C6; DHAWAN STUDIO <span>PRO</span></div>
      <span class="sub-brand-tag">welcome to shubh world</span>
    </div>
    <button class="update-pill" onclick="forceAppRefresh()">⚡ Check Update</button>
  </header>

  <div class="container">
    <div class="panel">
      <div class="title-row">App Configuration</div>
      
      <label>
        App Name
        <input type="text" id="appName" value="My Mobile App">
      </label>

      <div class="icon-box">
        <div class="icon-preview" id="iconDisplay">
          <!-- Supports both icon.jpg and icon.png directly -->
          <img src="icon.jpg" onerror="this.onerror=null;this.src='icon.png';" alt="App Icon">
        </div>
        <label style="flex: 1;">
          Change App Icon (.jpg / .png)
          <input type="file" id="iconInput" accept="image/*" onchange="loadIcon(event)" style="font-size: 11px; padding: 2px;">
        </label>
      </div>

      <div class="title-row">Source Code (HTML / CSS / JS)</div>
      <textarea id="sourceCode" oninput="runCode()" placeholder="Paste HTML/CSS/JS code here..."></textarea>

      <div class="primary-install-box">
        <button class="install-big-btn" onclick="triggerAppInstall()">📲 Install on Phone</button>
        <button class="apk-cloud-btn" onclick="saveMobileFile()">💾 Save App File</button>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="runCode()">👁 Refresh View</button>
      </div>
    </div>

    <div class="preview-panel">
      <div class="title-row">PHONE PREVIEW SCREEN</div>
      <div class="phone">
        <div class="notch-bar"><div class="camera"></div></div>
        <iframe id="phoneScreen"></iframe>
        <div class="nav-bar-pill"><div class="gesture-indicator"></div></div>
      </div>
    </div>

    <footer class="app-footer">welcome to shubh world</footer>
  </div>

  <div id="toast">Ready</div>

  <script>
    let iconBase64 = null;
    let installPrompt = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Force clear local phone cache and fetch latest GitHub changes
    function forceAppRefresh() {
      if ('caches' in window) {
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name));
        });
      }
      showToast('Purging cache & syncing...');
      setTimeout(() => {
        window.location.reload(true);
      }, 500);
    }

    // Automatic update check when installed app opens
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.update();
        }
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
    });

    function triggerAppInstall() {
      if (installPrompt) {
        installPrompt.prompt();
        installPrompt.userChoice.then(() => { installPrompt = null; });
      } else {
        showToast('Browser menu (⋮) par tap karke "Add to Home screen" select karein!');
      }
    }

    function loadIcon(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        iconBase64 = e.target.result;
        document.getElementById('iconDisplay').innerHTML = `<img src="${iconBase64}">`;
        showToast('Icon Updated!');
      };
      reader.readAsDataURL(file);
    }

    function runCode() {
      const raw = document.getElementById('sourceCode').value;
      const iframe = document.getElementById('phoneScreen');
      
      const pureBlackPlaceholder = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body {
              margin: 0;
              background-color: #000000 !important;
              color: #222222;
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100vh;
              font-family: -apple-system, system-ui, sans-serif;
              font-size: 11px;
              letter-spacing: 2px;
              text-transform: uppercase;
              overflow: hidden;
            }
          </style>
        </head>
        <body>Awaiting Input</body>
        </html>
      `;

      iframe.srcdoc = raw.trim() ? raw : pureBlackPlaceholder;
    }

    function saveMobileFile() {
      const code = document.getElementById('sourceCode').value;
      const name = document.getElementById('appName').value.trim() || 'MyApp';

      if (!code.trim()) {
        showToast('Pehle code likhein!');
        return;
      }

      const filename = name.replace(/\s+/g, '_').toLowerCase() + '.html';
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);

      showToast('File saved!');
    }

    window.onload = function() {
      runCode();
    };
  </script>
</body>
</html>
