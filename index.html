<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhawan Studio Pro</title>
  <meta name="theme-color" content="#070707">
  
  <!-- Dynamic Web App Manifest -->
  <link rel="manifest" id="dynamicManifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Dhawan%20Studio%20Pro%22%2C%22short_name%22%3A%22DhawanStudio%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23070707%22%2C%22theme_color%22%3A%22%23070707%22%2C%22icons%22%3A%5B%5D%7D">

  <style>
    :root {
      --bg: #070707;
      --card: #111111;
      --card-border: #220808;
      --blood-dark: #440000;
      --blood-red: #8b0000;
      --blood-bright: #dc2626;
      --text: #f4f4f5;
      --text-dim: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 4, 4, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--blood-red);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    
    .brand-wrap { display: flex; flex-direction: column; gap: 1px; }
    .brand { font-weight: 900; font-size: 16px; letter-spacing: 0.8px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--blood-bright); }

    .sub-brand-tag {
      font-size: 10.5px;
      font-weight: 700;
      color: #ff4d4d;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(220, 38, 38, 0.45);
      user-select: none;
      margin-top: 1px;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    
    .vault-pill-btn {
      background: #180505;
      border: 1px solid var(--blood-bright);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .vault-pill-btn:hover { background: var(--blood-red); }
    .vault-count {
      background: var(--blood-bright);
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 12px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--blood-bright);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    @media(max-width: 480px) {
      .input-grid { grid-template-columns: 1fr; }
    }
    
    label { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; font-weight: 600; width: 100%; }
    
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: #080808;
      border: 1px solid #331111;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      border-color: var(--blood-bright);
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
    }
    textarea { 
      min-height: 180px; 
      font-family: ui-monospace, monospace; 
      line-height: 1.45; 
      font-size: 12.5px; 
      tab-size: 2; 
      resize: vertical; 
    }

    .locked-input {
      cursor: not-allowed;
      border-style: dashed !important;
      color: #aaa !important;
      background: #060202 !important;
      user-select: none;
    }
    .locked-input:not([readonly]) {
      cursor: text !important;
      border-style: solid !important;
      color: #fff !important;
      background: #080808 !important;
      border-color: var(--blood-bright) !important;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.45);
      user-select: auto;
    }

    .icon-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #090404;
      padding: 10px;
      border: 1px dashed var(--blood-dark);
      border-radius: 6px;
    }
    .icon-preview {
      width: 46px;
      height: 46px;
      background: #000;
      border: 1px solid var(--blood-red);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .icon-preview img, .icon-preview svg { width: 100%; height: 100%; object-fit: cover; }

    /* Action Buttons Row */
    .primary-install-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    @media(max-width: 480px) {
      .primary-install-box { grid-template-columns: 1fr; }
    }

    .install-big-btn {
      background: linear-gradient(135deg, #8b0000, #dc2626);
      color: #fff;
      border: 1px solid #ff4d4d;
      padding: 13px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: all 0.2s;
    }
    .install-big-btn:hover {
      background: linear-gradient(135deg, #a00000, #ef4444);
      transform: translateY(-1px);
    }

    .apk-cloud-btn {
      background: #140505;
      color: #ff6666;
      border: 1px solid var(--blood-red);
      padding: 13px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .apk-cloud-btn:hover {
      background: #240808;
      border-color: var(--blood-bright);
      color: #fff;
    }

    .btn-row { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 8px; 
      width: 100%;
    }
    @media(max-width: 480px) { 
      .btn-row { grid-template-columns: 1fr; } 
    }

    button.action-btn {
      padding: 10px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #2e0d0d;
      background: #0c0404;
      color: #ccc;
      transition: 0.2s;
      text-align: center;
    }
    button.action-btn:hover {
      background: #1c0707;
      color: #fff;
      border-color: var(--blood-red);
    }

    /* Live Preview Panel */
    .preview-panel {
      background: #0c0505;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 14px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .preview-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mini-ctrl-btn {
      background: #180808;
      border: 1px solid #3d0e0e;
      color: #bbb;
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    .phone {
      width: 100%;
      max-width: 325px;
      height: 640px;
      background: #000;
      border: 6px solid #1c0808;
      outline: 1px solid #3a0d0d;
      border-radius: 36px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.95), 0 0 24px rgba(139, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    
    .notch-bar {
      height: 22px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .camera {
      width: 9px;
      height: 9px;
      background: #040202;
      border: 1.5px solid #280808;
      border-radius: 50%;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .nav-bar-pill {
      height: 16px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .gesture-indicator {
      width: 100px;
      height: 3.5px;
      background: #444;
      border-radius: 4px;
    }

    footer.app-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 8px 24px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ff4d4d;
      text-transform: uppercase;
      user-select: none;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .modal-backdrop.active { display: flex; }

    .modal-box {
      background: #0e0707;
      border: 1px solid #4a1010;
      border-radius: 12px;
      width: 100%;
      max-width: 530px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #200606;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #140404;
    }
    .modal-title { font-size: 13px; font-weight: bold; color: #fff; }
    .close-icon { background: none; border: none; color: #999; font-size: 20px; cursor: pointer; }

    .modal-body { padding: 14px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 12px; }

    .modal-footer {
      padding: 10px 14px;
      border-top: 1px solid #200606;
      background: #120404;
      display: flex;
      justify-content: flex-end;
    }
    .btn-apply { background: var(--blood-bright); color: #fff; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; font-size: 12px; cursor: pointer; }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #140404;
      border: 1px solid var(--blood-bright);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.85);
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      z-index: 9999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand"><span>&#x25C6;</span> DHAWAN STUDIO <span>PRO</span></div>
      <span class="sub-brand-tag">welcome to shubh world</span>
    </div>
    <div class="header-actions">
      <button class="vault-pill-btn" onclick="openVaultModal()">
        <span>📦 Saved Apps</span>
        <span class="vault-count" id="vaultHeaderBadge">0</span>
      </button>
    </div>
  </header>

  <div class="container">
    
    <div class="panel">
      
      <div class="title-row">
        <span>App Setup</span>
        <span style="color:#ff6666; font-size:10px;">Direct Install Ready</span>
      </div>

      <div class="input-grid">
        <label>
          App Name
          <input type="text" id="appName" value="My Mobile App" oninput="handleInputSync()">
        </label>
        <label>
          Package ID <span style="font-size:9.5px; color:#ff6666;">[🔒 Double-tap]</span>
          <input type="text" id="pkgName" class="locked-input" value="com.dhawan.myapp" readonly>
        </label>
      </div>

      <div class="icon-box">
        <div class="icon-preview" id="iconDisplay">
          <svg id="defaultSvgIcon" viewBox="0 0 512 512">
            <rect width="512" height="512" fill="#060101" />
            <polygon points="256,42 458,256 256,470 54,256" fill="#0f0202" stroke="#dc2626" stroke-width="16" />
            <polyline points="204,196 148,256 204,316" fill="none" stroke="#dc2626" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
            <polyline points="308,196 364,256 308,316" fill="none" stroke="#dc2626" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
            <line x1="280" y1="184" x2="232" y2="328" stroke="#ff2222" stroke-width="24" stroke-linecap="round" />
            <circle cx="256" cy="256" r="12" fill="#ffffff" />
          </svg>
        </div>
        <label style="flex: 1;">
          App Icon (.png / .jpg)
          <input type="file" id="iconInput" accept="image/*" onchange="loadIcon(event)" style="font-size: 11px; padding: 2px; color: #aaa;">
        </label>
      </div>

      <div class="title-row">
        <span>Source Code (HTML / CSS / JS)</span>
        <span style="font-size: 10px; color: #888;">Paste your app code here</span>
      </div>
      
      <textarea id="sourceCode" spellcheck="false" placeholder="Write or paste your HTML, CSS, JS code here..."></textarea>

      <!-- Big Action Buttons -->
      <div class="primary-install-box">
        <button class="install-big-btn" id="installPwaBtn" onclick="installDirectToPhone()">
          <span>📲 Install on Phone</span>
        </button>
        <button class="apk-cloud-btn" onclick="saveAndExportBundle()">
          <span>⚡ Save & Export App</span>
        </button>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="runCode(true)">👁 Render View</button>
        <button class="action-btn" onclick="document.getElementById('bundleImporter').click()">📂 Open Saved File</button>
        <button class="action-btn" onclick="openVaultModal()">📦 My Projects</button>
      </div>
      <input type="file" id="bundleImporter" accept=".json,.html" style="display: none;" onchange="importProject(event)">

    </div>

    <!-- Live Preview Panel -->
    <div class="preview-panel" id="previewSection">
      <div class="preview-header">
        <span class="title-row">Phone Preview Screen</span>
        <button class="mini-ctrl-btn" onclick="runCode(false)">&#x21bb; Reload</button>
      </div>

      <div class="phone">
        <div class="notch-bar"><div class="camera"></div></div>
        <iframe id="phoneScreen"></iframe>
        <div class="nav-bar-pill"><div class="gesture-indicator"></div></div>
      </div>
    </div>

    <footer class="app-footer">welcome to shubh world</footer>

  </div>

  <!-- Vault Modal -->
  <div class="modal-backdrop" id="vaultModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">📦 Saved Apps & History</div>
        <button class="close-icon" onclick="closeVaultModal()">&times;</button>
      </div>
      <div class="modal-body" id="vaultListContainer">
        <div style="color:#666; font-size:12px; text-align:center; padding:20px;">Use 'Save & Export App' to keep apps here.</div>
      </div>
      <div class="modal-footer">
        <button class="btn-apply" onclick="closeVaultModal()">Close</button>
      </div>
    </div>
  </div>

  <div id="toast">Ready</div>

  <script>
    let iconBase64 = null;
    let deferredPrompt = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installPwaBtn');
      if (btn) btn.style.display = 'flex';
    });

    function installDirectToPhone() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            showToast('Installing application to phone!');
          }
          deferredPrompt = null;
        });
      } else {
        // Fallback instructions for mobile browsers
        showToast('Browser menu (⋮) kholo aur "Add to Home screen" / "Install App" par tap karo!');
      }
    }

    function handleInputSync() {
      const name = document.getElementById('appName').value.trim();
      const sanitized = name.toLowerCase().replace(/[^a-z0-9]/g, '');
      document.getElementById('pkgName').value = 'com.dhawan.' + (sanitized || 'app');
      updateDynamicManifest();
    }

    function updateDynamicManifest() {
      const appName = document.getElementById('appName').value.trim() || "My Mobile App";
      const iconsArr = iconBase64 ? [{ src: iconBase64, sizes: "192x192", type: "image/png" }] : [];
      
      const manifestObj = {
        name: appName,
        short_name: appName.replace(/\s+/g, '').substring(0, 12),
        start_url: ".",
        display: "standalone",
        background_color: "#070707",
        theme_color: "#070707",
        icons: iconsArr
      };

      const stringified = JSON.stringify(manifestObj);
      const blob = new Blob([stringified], { type: 'application/manifest+json' });
      document.getElementById('dynamicManifest').setAttribute('href', URL.createObjectURL(blob));
    }

    function attachDoubleTapProtection(id) {
      const el = document.getElementById(id);
      let last = 0;
      el.addEventListener('touchend', (e) => {
        let now = Date.now();
        if (now - last < 350) { el.removeAttribute('readonly'); el.focus(); showToast('Unlocked for editing'); }
        last = now;
      });
      el.addEventListener('dblclick', () => { el.removeAttribute('readonly'); el.focus(); showToast('Unlocked for editing'); });
      el.addEventListener('blur', () => { el.setAttribute('readonly', 'true'); });
    }

    function loadIcon(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        iconBase64 = e.target.result;
        document.getElementById('iconDisplay').innerHTML = `<img src="${iconBase64}">`;
        updateDynamicManifest();
        showToast('Icon updated!');
      };
      reader.readAsDataURL(file);
    }

    function runCode(scroll) {
      const code = document.getElementById('sourceCode').value;
      const iframe = document.getElementById('phoneScreen');
      iframe.srcdoc = code || '<div style="color:#555;font-family:sans-serif;text-align:center;padding-top:100px;">No code rendered. Paste HTML/CSS/JS above.</div>';
      showToast('Rendered in Mobile Screen');
      if (scroll) {
        document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
      }
    }

    function saveAndExportBundle() {
      const appName = document.getElementById('appName').value.trim() || 'MyApp';
      const code = document.getElementById('sourceCode').value;
      
      if (!code) {
        showToast('Pehle source code box me kuch likhiye ya paste kijiye!');
        return;
      }

      // 1. Download as ready-to-run Standalone HTML file
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (appName.replace(/\s+/g, '_').toLowerCase()) + '.html';
      a.click();
      URL.revokeObjectURL(a.href);

      showToast('App file saved! Direct installable.');
    }

    function importProject(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('sourceCode').value = e.target.result;
        runCode(false);
        showToast('Code imported!');
      };
      reader.readAsText(file);
    }

    function openVaultModal() { document.getElementById('vaultModal').classList.add('active'); }
    function closeVaultModal() { document.getElementById('vaultModal').classList.remove('active'); }

    window.onload = function() {
      attachDoubleTapProtection('pkgName');
      updateDynamicManifest();
      runCode(false);
    };
  </script>
</body>
</html>
