name: Dhawan Studio Pro Cloud APK Factory

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ build_user_app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Setup Project & Zero-Delay Splash Screen
        run: |
          # 1. Payload Data Check
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PKG_NAME="${{ github.event.client_payload.pkg_name }}"
          SOURCE_HTML="${{ github.event.client_payload.html_code }}"
          ICON_BASE64="${{ github.event.client_payload.icon_base64 }}"

          [ -z "$APP_NAME" ] && APP_NAME="Dhawan Studio Pro"
          [ -z "$PKG_NAME" ] && PKG_NAME="com.dhawan.studiopro"

          # 2. Create Cordova Project
          cordova create myapp "$PKG_NAME" "$APP_NAME"
          cd myapp

          # 3. Dynamic Version Code & Pure Zero Splash Screen Preferences
          TIMESTAMP_VC=$(date +%s | cut -c 3-10)
          sed -i "s/<widget /<widget android-versionCode=\"$TIMESTAMP_VC\" /g" config.xml
          sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="ShowSplashScreen" value="false" />\n    <preference name="FadeSplashScreen" value="false" />' config.xml

          # 4. Copy Code
          rm -rf www/*
          if [ -n "$SOURCE_HTML" ]; then
            echo "$SOURCE_HTML" > www/index.html
          elif [ -f ../index.html ]; then
            cp ../index.html www/index.html
          fi

          # 5. Native Icon Injection
          mkdir -p res
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | sed 's/^data:image\/[a-z]*;base64,//' | base64 -d > res/icon_raw.png
            convert res/icon_raw.png -resize 512x512 res/icon.png
          elif [ -f ../icon.jpg ]; then
            convert ../icon.jpg -resize 512x512 res/icon.png
          fi

          if [ -f res/icon.png ]; then
            sed -i '/<\/widget>/i \    <platform name="android">\n        <icon src="res/icon.png" density="ldpi" />\n        <icon src="res/icon.png" density="mdpi" />\n        <icon src="res/icon.png" density="hdpi" />\n        <icon src="res/icon.png" density="xhdpi" />\n        <icon src="res/icon.png" density="xxhdpi" />\n        <icon src="res/icon.png" density="xxxhdpi" />\n    </platform>' config.xml
          fi

          # 6. Build APK
          cordova platform add android
          cordova build android --debug

          # Move APK for release
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../DhawanStudioPro.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Dhawan Studio Pro (Direct APK)
          body: "Auto-compiled standalone APK by Dhawan Studio Pro Engine."
          files: DhawanStudioPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
