name: Dhawan Studio Pro Cloud APK Factory

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ build_user_app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Build Android APK
        run: |
          # 1. Check if user built app or master app
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PKG_NAME="${{ github.event.client_payload.pkg_name }}"
            HTML_B64="${{ github.event.client_payload.html_b64 }}"
            OUT_APK="DhawanCustomApp.apk"
            REL_TAG="user-app-build"
            REL_NAME="User Generated App"
          else
            APP_NAME="Dhawan Studio Pro"
            PKG_NAME="com.dhawan.studiopro"
            HTML_B64=""
            OUT_APK="DhawanStudioPro.apk"
            REL_TAG="latest-build"
            REL_NAME="Dhawan Studio Pro Master App"
          fi

          [ -z "$APP_NAME" ] && APP_NAME="Dhawan Studio Pro"
          [ -z "$PKG_NAME" ] && PKG_NAME="com.dhawan.studiopro"

          # 2. Setup Project
          cordova create myapp "$PKG_NAME" "$APP_NAME"
          cd myapp

          # Version code taaki har baar phone UPDATE bole
          TIMESTAMP_VC=$(date +%s | cut -c 3-10)
          sed -i "s/<widget /<widget android-versionCode=\"$TIMESTAMP_VC\" /g" config.xml

          # Zero splash preferences
          sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" />\n    <preference name="AutoHideSplashScreen" value="true" />\n    <preference name="ShowSplashScreen" value="false" />\n    <preference name="FadeSplashScreen" value="false" />' config.xml

          # Copy App Code
          rm -rf www/*
          if [ -n "$HTML_B64" ]; then
            echo "$HTML_B64" | base64 -d > www/index.html
          elif [ -f ../index.html ]; then
            cp ../index.html www/index.html
          fi

          # Copy Icon if exists
          if [ -f ../icon.jpg ]; then
            mkdir -p res
            cp ../icon.jpg res/icon.png
            sed -i '/<\/widget>/i \    <platform name="android">\n        <icon src="res/icon.png" />\n    </platform>' config.xml
          fi

          # 3. Add Android Platform
          cordova platform add android

          # 4. Standard Consistent Debug Build (Never causes signature conflicts)
          cordova build android --debug

          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "../$OUT_APK"
          echo "OUT_APK=$OUT_APK" >> $GITHUB_ENV
          echo "REL_TAG=$REL_TAG" >> $GITHUB_ENV
          echo "REL_NAME=$REL_NAME" >> $GITHUB_ENV

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: ${{ env.REL_NAME }}
          files: ${{ env.OUT_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
