name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Build Cordova Project
        run: |
          # 1. Project create
          cordova create myapp com.dhawan.studiopro "Dhawan Studio Pro"
          cd myapp

          # 2. Copy source code
          rm -rf www/*
          if [ -f ../index.html ]; then
            cp ../index.html www/index.html
          fi

          # 3. Clean icon injection via config.xml (Official Cordova Way)
          if [ -f ../icon.jpg ]; then
            echo "Processing icon.jpg..."
            convert ../icon.jpg -resize 512x512 icon_app.png
            # Inject into config.xml so cordova handles all mipmaps automatically
            sed -i '/<\/widget>/i \    <icon src="icon_app.png" />' config.xml
          fi

          # 4. Add Android Platform
          cordova platform add android

          # 5. Build APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhawan-Studio-Pro-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
