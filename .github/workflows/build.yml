name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g cordova

      - name: Create Native App & Inject All Assets
        run: |
          # 1. Create clean Cordova app
          cordova create myapp com.dhawan.studiopro "Dhawan Studio Pro"
          cd myapp
          cordova platform add android

          # 2. Inject current index.html
          rm -rf www/*
          if [ -f ../index.html ]; then
            cp ../index.html www/index.html
          fi

          # 3. Process Custom icon.jpg if uploaded
          if [ -f ../icon.jpg ]; then
            echo "Processing and injecting custom icon.jpg..."
            mkdir -p res/icon/android

            # Generate standard sizes
            convert ../icon.jpg -resize 36x36 res/icon/android/ldpi.png
            convert ../icon.jpg -resize 48x48 res/icon/android/mdpi.png
            convert ../icon.jpg -resize 72x72 res/icon/android/hdpi.png
            convert ../icon.jpg -resize 96x96 res/icon/android/xhdpi.png
            convert ../icon.jpg -resize 144x144 res/icon/android/xxhdpi.png
            convert ../icon.jpg -resize 192x192 res/icon/android/xxxhdpi.png

            # Replace native Android project mipmap icons permanently
            for resdir in platforms/android/app/src/main/res/mipmap-*; do
              if [ -d "$resdir" ]; then
                convert ../icon.jpg -resize 192x192 "$resdir/ic_launcher.png" 2>/dev/null || true
                convert ../icon.jpg -resize 192x192 "$resdir/ic_launcher_round.png" 2>/dev/null || true
                convert ../icon.jpg -resize 192x192 "$resdir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

          # 4. Auto-Increment versionCode so phone ALWAYS allows "Update" over existing app
          TIMESTAMP_VC=$(date +%s | cut -c 3-10)
          sed -i "s/android:versionCode=\"[0-9]*\"/android:versionCode=\"$TIMESTAMP_VC\"/g" platforms/android/app/src/main/AndroidManifest.xml || true

          # 5. Build Native Debug APK
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhawan-Studio-Pro-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
