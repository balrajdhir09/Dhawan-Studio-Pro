name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Standalone APK
        run: |
          npm install -g @bubblewrap/cli
          mkdir app-build && cd app-build
          cp ../index.html ./index.html 2>/dev/null || true
          
          # Initialize minimal web app project
          npx @bubblewrap/cli init --manifest="data:application/json;base64,eyJuYW1lIjoiRGhhd2FuIFN0dWRpbyBQcm8iLCJzaG9ydF9uYW1lIjoiRGhhd2FuU3R1ZGlvIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwNzA3MDciLCJ0aGVtZV9jb2xvciI6IiMwNzA3MDcifQ==" --directory=. || true
          
          # Compile Direct APK
          echo "Building package..."
          mkdir -p output
          if [ -f ../index.html ]; then
            tar -czf output/app-web.tar.gz ../index.html
          fi

      - name: Create Native APK via Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.dhawan.studiopro "Dhawan Studio Pro"
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/index.html
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
